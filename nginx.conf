server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Canonical host is the apex; send www there.
    if ($host = www.staylit.live) {
        return 301 https://staylit.live$request_uri;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Hashed build output never changes.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker and manifest must be revalidated so updates roll out.
    location ~* ^/(sw\.js|registerSW\.js|workbox-.*\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # First-party proxy for Umami: privacy blockers drop third-party analytics
    # hosts, so the anonymous stats script and its beacon go through this
    # domain. A variable in proxy_pass makes nginx resolve the host at request
    # time, so a DNS hiccup can never stop the site from starting.
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    set $umami_upstream https://cloud.umami.is;

    location = /s/l.js {
        proxy_pass $umami_upstream/script.js;
        proxy_ssl_server_name on;
        proxy_set_header Host cloud.umami.is;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /api/send {
        proxy_pass $umami_upstream/api/send;
        proxy_ssl_server_name on;
        proxy_set_header Host cloud.umami.is;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Prerendered routes live at /<route>/index.html; everything else is the SPA shell.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html /index.html;
    }
}
