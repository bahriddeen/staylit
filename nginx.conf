server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Canonical host is the apex; send www there.
    if ($host = www.staylit.live) {
        return 301 https://staylit.live$request_uri;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Hashed build output never changes.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker and manifest must be revalidated so updates roll out.
    location ~* ^/(sw\.js|registerSW\.js|workbox-.*\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Prerendered routes live at /<route>/index.html; everything else is the SPA shell.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html /index.html;
    }
}
