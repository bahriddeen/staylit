<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="StayLit" />

    <!-- Primary meta -->
    <title>Keep Your Screen On · StayLit</title>
    <meta
      name="description"
      content="Keep your screen awake in the browser. No install, no sign-up. Set a timer or keep your display on indefinitely for downloads, coding, AI sessions, and presentations."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://staylit.live/" />
    <meta
      name="theme-color"
      content="#0b0d10"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#f6f7f9"
      media="(prefers-color-scheme: light)"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StayLit" />
    <meta property="og:title" content="Keep Your Screen On · StayLit" />
    <meta
      property="og:description"
      content="Keep your screen awake in the browser. No install, no sign-up. Set a timer or keep your display on indefinitely."
    />
    <meta property="og:url" content="https://staylit.live/" />
    <meta property="og:image" content="https://staylit.live/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Keep Your Screen On · StayLit" />
    <meta
      name="twitter:description"
      content="Keep your screen awake in the browser. No install, no sign-up."
    />
    <meta name="twitter:image" content="https://staylit.live/og.png" />

    <!-- Structured data: WebApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "StayLit",
        "url": "https://staylit.live/",
        "description": "Keep your screen awake in the browser. No install, no sign-up. Set a timer or keep your display on indefinitely.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (modern web browser)",
        "browserRequirements": "Requires a browser with the Screen Wake Lock API",
        "inLanguage": [
          "en",
          "ru",
          "uz",
          "ar",
          "ja",
          "de",
          "es",
          "fr",
          "it",
          "pt",
          "ko",
          "zh"
        ],
        "image": "https://staylit.live/og.png",
        "screenshot": "https://staylit.live/og.png",
        "featureList": [
          "Keep your screen awake with the Screen Wake Lock API",
          "Full-screen digital clock with multiple themes",
          "Animated flip clock",
          "Countdown, interval (Pomodoro), and bell timers",
          "Stopwatch with lap times",
          "Alarm that rings at a set time",
          "Works offline, installable as a PWA"
        ],
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <!-- Structured data: FAQPage (updated per-route by app/seo.ts) -->
    <script type="application/ld+json" id="ld-faq">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is Keep Awake free?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. It’s completely free, with no account and no ads that follow you around."
            }
          },
          {
            "@type": "Question",
            "name": "Does it work if I switch tabs or minimize the window?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Browsers only allow a wake lock while the tab is visible. If you switch away or minimize, it pauses and then resumes automatically when you come back."
            }
          },
          {
            "@type": "Question",
            "name": "Will it drain my battery?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "It only keeps the display awake, which uses some power like any lit screen. It doesn’t run heavy background work, so the impact is minimal."
            }
          },
          {
            "@type": "Question",
            "name": "Which browsers are supported?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Recent versions of Chrome, Edge, and Safari support the Screen Wake Lock API. Older browsers may fall back to a lightweight video method or may not be supported."
            }
          },
          {
            "@type": "Question",
            "name": "Is any of my data collected?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Everything runs locally in your browser. Your settings are stored on your device and never sent anywhere."
            }
          }
        ]
      }
    </script>

    <!-- Apply the saved theme before first paint to avoid a flash / layout shift. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("awake-clock:theme");
          if (raw) {
            var theme = JSON.parse(raw);
            if (theme === "light" || theme === "dark") {
              document.documentElement.setAttribute("data-theme", theme);
            }
          }
        } catch (e) {
          /* storage unavailable, fall back to prefers-color-scheme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app" class="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script
      data-name="BMC-Widget"
      data-cfasync="false"
      src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js"
      data-id="mbahriddin"
      data-description="Support me on Buy me a coffee!"
      data-message=""
      data-color="#5F7FFF"
      data-position="Right"
      data-x_margin="18"
      data-y_margin="18"
    ></script>
  </body>
</html>
